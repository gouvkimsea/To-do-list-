name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Verified dist/index.html exists"

      - name: Test Docker container build
        run: docker build -t interactive-todo:test .

